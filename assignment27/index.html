<!-- Key Event -->
<input type="text" onkeydown="keyEvent()" placeholder="Type something">

<br><br>

<!-- Change Event -->
<select onchange="changeEvent()">
  <option>HTML</option>
  <option>CSS</option>
  <option>JavaScript</option>
</select>

<script>
  function clickEvent() {
    document.getElementById("msg").innerHTML = "Button Clicked!";
  }

  function dblClickEvent() {
    document.getElementById("msg").innerHTML = "Button Double Clicked!";
  }

  function mouseOverEvent() {
    document.getElementById("msg").innerHTML = "Mouse Over Image!";
  }

  function mouseOutEvent() {
    document.getElementById("msg").innerHTML = "Mouse Out Image!";
  }

  function keyEvent() {
    document.getElementById("msg").innerHTML = "Key Pressed!";
  }

  function changeEvent() {
    document.getElementById("msg").innerHTML = "Value Changed!";
  }
</script>
