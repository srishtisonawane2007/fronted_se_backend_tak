
<!DOCTYPE html>
<html>
<head>
  <title>Loop Programs</title>
</head>
<body>

<script>

// FizzBuzz Program



for (let i = 1; i <= 20; i++) {

  if (i % 3 == 0 && i % 5 == 0) {
    document.write("FizzBuzz <br>");
  }

  else if (i % 3 == 0) {
    document.write("Fizz <br>");
  }

  else if (i % 5 == 0) {
    document.write("Buzz <br>");
  }

  else {
    document.write(i + "<br>");
  }

}

</script>

</body>
</html>
