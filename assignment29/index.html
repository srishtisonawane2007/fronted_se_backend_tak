<!DOCTYPE html>
 <html>
     <head> 
        <title>Palindrome Number</title> 
        </head> <body>
             <script>
              let num = Number(prompt("Enter a number")); 
              let original = num; 
              let reverse = 0;
               while (num > 0) 
               { 
                let rem = num % 10;
                 reverse = reverse * 10 + rem; num = parseInt(num / 10);
                 }
                  if (original == reverse)
                   {
                     document.write("Palindrome Number"); 
                    } 
                    else
                     {
                         document.write("Not Palindrome Number"); 
                        }
 </script> 
 </body>
  </html>
