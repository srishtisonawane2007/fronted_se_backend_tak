<!DOCTYPE html>
<html>
<head>
  <title>Function Types</title>
</head>
<body>

<h2>JavaScript Function Types</h2>

<script>
  // 1. No Argument No Return
  function greet() {
    document.write("No Argument No Return: Hello Student<br>");
  }
  greet();

  // 2. Argument No Return
  function add(a, b) {
    document.write("Argument No Return: Sum = " + (a + b) + "<br>");
  }
  add(10, 20);

  // 3. No Argument With Return
  function getNumber() {
    return 50;
  }
  let num = getNumber();
  document.write("No Argument With Return: Number = " + num + "<br>");

  // 4. Argument With Return
  function multiply(a, b) {
    return a * b;
  }
  let result = multiply(5, 4);
  document.write("Argument With Return: Product = " + result + "<br>");
</script>

</body>
</html>
