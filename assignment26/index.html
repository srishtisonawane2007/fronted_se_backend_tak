<!DOCTYPE html>
<html>
<head>
  <title>Math Functions</title>
</head>
<body>

<h2>JavaScript Math Functions</h2>

<script>
  document.write("Math.round(4.6) = " + Math.round(4.6) + "<br>");
  document.write("Math.round(4.3) = " + Math.round(4.3) + "<br><br>");

  document.write("Math.ceil(4.2) = " + Math.ceil(4.2) + "<br>");
  document.write("Math.ceil(4.9) = " + Math.ceil(4.9) + "<br><br>");

  document.write("Math.floor(4.2) = " + Math.floor(4.2) + "<br>");
  document.write("Math.floor(4.9) = " + Math.floor(4.9) + "<br><br>");

  document.write("Math.sqrt(25) = " + Math.sqrt(25) + "<br>");
  document.write("Math.sqrt(49) = " + Math.sqrt(49) + "<br><br>");

  document.write("Math.pow(2,3) = " + Math.pow(2,3) + "<br>");
  document.write("Math.pow(5,2) = " + Math.pow(5,2) + "<br><br>");

  document.write("Math.random() = " + Math.random() + "<br>");
</script>

</body>
</html>
