
<!DOCTYPE html>
<html>
<head>
  <title>Array Programs</title>
</head>
<body>

<script>

let arr1 = [10, 25, 7, 90, 45];

let largest = arr1[0];

for (let i = 0; i < arr1.length; i++) {

  if (arr1[i] > largest) {
    largest = arr1[i];
  }

}

document.write("Largest Number : " + largest);

document.write("<br><br>");

let arr2 = [10, 20, 30, 40, 50];

let sum = 0;

for (let i = 0; i < arr2.length; i++) {

  sum = sum + arr2[i];

}

document.write("Sum of Array : " + sum);

</script>

</body>
</html>
