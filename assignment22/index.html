<!DOCTYPE html>
<html lang="en">
<head>
    <title>Voting Eligibility</title>
</head>
<body>

<script>

    const name = prompt("Enter Your Name:");
    const age = parseInt(prompt("Enter Your Age:"));

    if (age >= 18) {
        document.write(name + " you are eligible for voting");
    } else {
        document.write(name + " you are not eligible for voting");
    }

</script>

</body>
</html>
