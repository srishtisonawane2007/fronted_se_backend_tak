<!DOCTYPE html>
<html>
<head>
  <title>Student Info</title>
</head>
<body>

<h2>Student Introduction</h2>

<p id="output"></p>

<script>
  // Direct values
  let studentName = "swara";
  let courseName = "JavaScript";
  let city = "Ahilyanagar";

  // Template string
  let message = `Hello, my name is ${studentName}. 
I am learning ${courseName}. 
I live in ${city}.`;

  // Show on webpage
  document.getElementById("output").innerText = message;

 
</script>

</body>
</html>
