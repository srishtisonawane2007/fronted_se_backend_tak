<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Styled Buttons</title>

  <style>

    body{
      background-color:white;
    }

    .container{
      margin: 40px;
    }

    h1{
      text-align: center;
      margin-bottom: 40px;
    }

    button{
      font-size: 18px;
      cursor: pointer;
      transition: 0.5s;
    }

    /* Button 1 */
    .btn1{
      background-color: red;
      color: white;
      border: none;
      padding: 12px 25px;
      margin-top: 20px;
      margin-right: 20px;
      border-radius: 10px;
    }

    .btn1:hover{
      box-shadow: 2px 2px 8px gray;
    }

    /* Button 2 */
    .btn2{
      background-color: blue;
      color: white;
      border: 3px solid black;
      padding: 15px 30px;
      margin: 30px 20px 30px 0px;
      border-radius: 20px;
    }

    .btn2:hover{
      background-color: darkblue;
    }

    /* Button 3 */
    .btn3{
      background-color: yellow;
      color: black;
      border: 2px solid black;
      padding: 20px 35px;
      margin-left: 40px;
      border-radius: 50px;
    }

    .btn3:hover{
      box-shadow: 3px 3px 10px black;
    }

    /* Button 4 */
    .btn4{
      background-color: green;
      color: white;
      border: none;
      padding: 10px 40px;
      margin: 40px;
      border-radius: 5px;
    }

    .btn4:hover{
      transform: scale(1.1);
    }

    /* Button 5 */
    .btn5{
      background-color: purple;
      color: white;
      border: 4px double white;
      padding: 18px 28px;
      margin-bottom: 30px;
      margin-left: 20px;
      border-radius: 15px;
    }

    .btn5:hover{
      box-shadow: 0px 0px 15px purple;
    }

    /* Button 6 */
    .btn6{
      background-color: orange;
      color: white;
      border: none;
      padding: 15px 45px;
      margin: 50px 20px;
      border-radius: 30px;
    }

    .btn6:hover{
      background-color: darkorange;
    }

    /* Button 7 */
    .btn7{
      background-color: black;
      color: white;
      border: 2px solid white;
      padding: 20px;
      margin-left: 60px;
      border-radius: 12px;
    }

    .btn7:hover{
      box-shadow: 5px 5px 15px gray;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Different Styled Buttons</h1>

    <button class="btn1">Button 1</button>

    <button class="btn2">Button 2</button>

    <button class="btn3">Button 3</button>

    <br><br>

    <button class="btn4">Button 4</button>

    <button class="btn5">Button 5</button>

    <button class="btn6">Button 6</button>

    <button class="btn7">Button 7</button>

  </div>

</body>
</html>
