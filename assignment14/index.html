<!DOCTYPE html>
<html lang="en">
<head>
  <title>Color Theory and Display Properties</title>

  <style>

    body{
      background-color: #f4f4f4;
      font-family: Arial;
      padding: 20px;
    }

    h1{
      text-align: center;
      color: rgb(0, 102, 204);
    }

    /* Block Elements */
    .block1{
      display: block;
      background-color: red;
      color: white;
      width: 300px;
      height: 80px;
      margin: 10px;
      padding: 10px;
    }

    .block2{
      display: block;
      background-color: #00b894;
      color: white;
      width: 300px;
      height: 80px;
      margin: 10px;
      padding: 10px;
    }

    /* Inline Elements */
    .inline1{
      display: inline;
      background-color: rgb(255, 165, 0);
      color: black;
      padding: 10px;
    }

    .inline2{
      display: inline;
      background-color: hsl(280, 80%, 60%);
      color: white;
      padding: 10px;
    }

    /* Inline Block Elements */
    .card{
      display: inline-block;
      width: 150px;
      height: 100px;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
      color: white;
      text-align: center;
    }

    .card1{
      background-color: #ff7675;
    }

    .card2{
      background-color: rgba(0, 0, 255, 0.7);
    }

    .card3{
      background-color: rgb(46, 204, 113);
    }

    /* Flexbox */
    .container{
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      flex-wrap: wrap;
      background-color: aqua;
      padding: 20px;
      margin-top: 20px;
    }

    .item{
      height: 100px;
      width: 100px;
      margin: 10px;
      font-size: 30px;
      text-align: center;
      line-height: 100px;
      color: white;
      border-radius: 10px;
    }

    .item1{
      background-color: tomato;
    }

    .item2{
      background-color: teal;
    }

    .item3{
      background-color: purple;
    }

  </style>
</head>

<body>

  <h1>Color Theory and Display Properties</h1>

  <!-- Block Elements -->
  <div class="block1">
    Block Element 1
  </div>

  <div class="block2">
    Block Element 2
  </div>

  <br>

  <!-- Inline Elements -->
  <span class="inline1">Inline 1</span>

  <span class="inline2">Inline 2</span>

  <br><br>

  <!-- Inline Block Elements -->
  <div class="card card1">
    Card 1
  </div>

  <div class="card card2">
    Card 2
  </div>

  <div class="card card3">
    Card 3
  </div>

  <!-- Flexbox -->
  <div class="container">

    <div class="item item1">
      1
    </div>

    <div class="item item2">
      2
    </div>

    <div class="item item3">
      3
    </div>

  </div>

</body>
</html>
